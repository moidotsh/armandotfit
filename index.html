<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      PWA / Add to Home Screen configuration.

      This file is the source-of-truth DECLARATION of which PWA tags the
      app expects to ship with. Two DELIVERY mechanisms restore them:

      1. scripts/inject-critical-web.ts — runs after `expo export` and
         copies the tags below (plus the id'd <style> blocks and any
         font preload links) into every exported dist/**/*.html <head>,
         so the DEPLOYED first frame carries them at parse time.

      2. The runtime injection in app/_layout.tsx (ensureMeta /
         ensureLink / ensureStyle) — restores the same set after
         hydration (dev server, and any path the export strip still
         misses).

      Expo Web's static export strips every tag below from <head>
      except <link rel="icon"> when generating dist/index.html. The
      three places are a deliberate mirror set — keep them in sync in
      the same change. The theme-color values are armandotfit's BOARD
      palette (the white board's edge tone on every width — the chrome never
      shouts); update this file, the injector's extraction, and
      app/_layout.tsx together so the deployed HTML and the runtime
      injection agree.
      Full design + debugging checklist: docs/architecture/pwa-installability.md.
    -->
    <meta name="theme-color" content="#F1F1EC" media="(min-width: 701px)" />
    <meta name="theme-color" content="#F1F1EC" media="(max-width: 700px)" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/192.png" />
    <link rel="icon" type="image/png" href="/icons/192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="armandotfit" />

    <title>armandotfit</title>

    <!--
      THE BOARD faces — self-hosted, OFL (docs/architecture/
      board-thesis.md §3.1). Archivo (one variable file, wght
      100–900 + wdth 62–125) speaks the board's words; 'Archivo
      Cond' is the SAME file declared a second time with
      font-stretch pinned at 75% — one download, two families, the
      STATEMENT position. Spline Sans Mono (one variable file, wght
      300–700) keeps EVERY figure; mono is tabular by construction.
      Mirror trio discipline: this id'd style block, the runtime
      restore in app/_layout.tsx, and the injector carry them
      together — plus the preload lines so the first statement and
      the first figure render in their faces, not fallbacks.
    -->
    <link rel="preload" href="/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/spline-sans-mono-var.woff2" as="font" type="font/woff2" crossorigin />
    <style id="arq-font-faces">
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/archivo-var.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Cond';
        font-style: normal;
        font-weight: 100 900;
        font-stretch: 75%;
        font-display: swap;
        src: url('/fonts/archivo-var.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Spline Sans Mono';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('/fonts/spline-sans-mono-var.woff2') format('woff2');
      }
    </style>

    <!--
      THE BOARD boot plate — the pre-JS cover. armandotfit's design
      language opens as the board: the white board's edge tone
      (#F1F1EC) with the name stamped in ink Archivo caps and a 2px
      record-orange rule beneath it — not a white flash, not a
      colored plate. The root layout lifts it via markBootReady() →
      html[data-boot-ready] as soon as React mounts (see
      utils/routeTransition.ts); reduced-motion users keep it as a
      static cover that simply disappears on lift. Pure CSS + one
      attribute — no script needed.
    -->
    <style id="ink-boot-plate">
      html:not([data-boot-ready]) body {
        background: #f1f1ec;
      }
      html:not([data-boot-ready]) #root::before {
        content: 'ARMANDOTFIT';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f1ec;
        color: #16181c;
        font-family: 'Archivo', -apple-system, sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        z-index: 9999;
      }
      html:not([data-boot-ready]) #root::after {
        content: '';
        position: fixed;
        left: 50%;
        top: calc(50% + 26px);
        width: 84px;
        height: 2px;
        margin-left: -42px;
        background: #c24100;
        z-index: 9999;
      }
      html[data-boot-ready] #root::before,
      html[data-boot-ready] #root::after {
        content: none;
      }
    </style>

    <!--
      The global shell CSS — keyed by id so the injector and the runtime
      injection share one key. Consumers self-hosting fonts: declare the
      @font-face block in an id'd <style> here and add the matching
      <link rel="preload" as="font" crossorigin> lines — the injector
      carries both into every exported route.
    -->
    <style id="global-scrollbar-css">
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #f1f1ec;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      /* Hide scrollbars across the entire app. The mobile-native
         indicators are gated per-ScrollView via
         showsVerticalScrollIndicator={false}; on web the only
         systematic way to suppress the always-visible desktop
         scrollbar is global CSS. A visible scrollbar on the
         centered 420pt mobile-first column reads as desktop chrome
         and breaks the immersive feel. */
      *::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>

    <!--
      The focus law (broadsheet-thesis P-FOCUS-1): the UA focus outline
      never leaks — RN-web renders real buttons/inputs whose default
      WebKit ring reads as alien chrome — and every focusable control
      carries OUR ring instead: a 2px rule in the element's own ink
      (currentColor — mode-correct by construction; inputs that draw the
      kit's own focus ring override this on their own boxShadow).
      Mirror trio: this block + the runtime restore in app/_layout.tsx
      (the injector carries id'd styles into every exported route).
    -->
    <style id="global-focus-css">
      button:focus,
      [role='button']:focus,
      [role='link']:focus,
      a:focus,
      select:focus {
        outline-width: 0;
        box-shadow: 0 0 0 2px currentColor;
      }
      input:focus,
      textarea:focus {
        outline-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
