<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      PWA / Add to Home Screen configuration.

      This file is the source-of-truth DECLARATION of which PWA tags the
      app expects to ship with. Two DELIVERY mechanisms restore them:

      1. scripts/inject-critical-web.ts — runs after `expo export` and
         copies the tags below (plus the id'd <style> blocks and any
         font preload links) into every exported dist/**/*.html <head>,
         so the DEPLOYED first frame carries them at parse time.

      2. The runtime injection in app/_layout.tsx (ensureMeta /
         ensureLink / ensureStyle) — restores the same set after
         hydration (dev server, and any path the export strip still
         misses).

      Expo Web's static export strips every tag below from <head>
      except <link rel="icon"> when generating dist/index.html. The
      three places are a deliberate mirror set — keep them in sync in
      the same change. The theme-color values are armandotfit's ember
      palette (warm paper surface for desktop, ember brand for mobile);
      update this file, the injector's extraction, and app/_layout.tsx
      together so the deployed HTML and the runtime injection agree.
      Full design + debugging checklist: docs/architecture/pwa-installability.md.
    -->
    <meta name="theme-color" content="#F4F0EA" media="(min-width: 701px)" />
    <meta name="theme-color" content="#E8590C" media="(max-width: 700px)" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/192.png" />
    <link rel="icon" type="image/png" href="/icons/192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="armandotfit" />

    <title>armandotfit</title>

    <!--
      The logbook faces — self-hosted, OFL (docs/architecture/
      logbook-thesis.md §2). Archivo ships as one variable-weight file
      (covers the 700/800 the display tokens use); IBM Plex Mono as two
      statics (500/600). Mirror trio discipline: this id'd style block,
      the runtime restore in app/_layout.tsx, and the injector carry
      them together — plus the preload lines below so the first hero
      figure renders in its face, not a fallback.
    -->
    <link rel="preload" href="/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-mono-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-mono-600.woff2" as="font" type="font/woff2" crossorigin />
    <style id="arq-font-faces">
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/archivo-var.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/plex-mono-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/plex-mono-600.woff2') format('woff2');
      }
    </style>

    <!--
      The ink boot plate — the pre-JS cover. armandotfit's design
      language is the ink dialect, so the first painted frame is the
      warm ink plate (#231B15) with the name stamped on it in paper
      type, not a white flash. The root layout lifts it via
      markBootReady() → html[data-boot-ready] as soon as React mounts
      (see utils/routeTransition.ts); reduced-motion users keep it as a
      static cover that simply disappears on lift. Pure CSS + one
      attribute — no script needed.
    -->
    <style id="ink-boot-plate">
      html:not([data-boot-ready]) body {
        background: #231b15;
      }
      html:not([data-boot-ready]) #root::before {
        content: 'armandotfit';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #231b15;
        color: #f4f0ea;
        font-family: 'Archivo', -apple-system, sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: lowercase;
        z-index: 9999;
      }
      html[data-boot-ready] #root::before {
        content: none;
      }
    </style>

    <!--
      The global shell CSS — keyed by id so the injector and the runtime
      injection share one key. Consumers self-hosting fonts: declare the
      @font-face block in an id'd <style> here and add the matching
      <link rel="preload" as="font" crossorigin> lines — the injector
      carries both into every exported route.
    -->
    <style id="global-scrollbar-css">
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #f4f0ea;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      /* Hide scrollbars across the entire app. The mobile-native
         indicators are gated per-ScrollView via
         showsVerticalScrollIndicator={false}; on web the only
         systematic way to suppress the always-visible desktop
         scrollbar is global CSS. A visible scrollbar on the
         centered 420pt mobile-first column reads as desktop chrome
         and breaks the immersive feel. */
      *::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
