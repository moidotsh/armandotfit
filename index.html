<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />

    <!--
      PWA / Add to Home Screen configuration.

      This file is the source-of-truth DECLARATION of which PWA tags the
      app expects to ship with. Two DELIVERY mechanisms restore them:

      1. scripts/inject-critical-web.ts — runs after `expo export` and
         copies the tags below (plus the id'd <style> blocks and any
         font preload links) into every exported dist/**/*.html <head>,
         so the DEPLOYED first frame carries them at parse time.

      2. The runtime injection in app/_layout.tsx (ensureMeta /
         ensureLink / ensureStyle) — restores the same set after
         hydration (dev server, and any path the export strip still
         misses).

      Expo Web's static export strips every tag below from <head>
      except <link rel="icon"> when generating dist/index.html. The
      three places are a deliberate mirror set — keep them in sync in
      the same change. The theme-color values are armandotfit's INTERVAL
      palette (the card's edge tone on every width — the chrome never
      shouts); update this file, the injector's extraction, and
      app/_layout.tsx together so the deployed HTML and the runtime
      injection agree.
      Full design + debugging checklist: docs/architecture/pwa-installability.md.
    -->
    <meta name="theme-color" content="#E9E2D2" media="(min-width: 701px)" />
    <meta name="theme-color" content="#E9E2D2" media="(max-width: 700px)" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/192.png" />
    <link rel="icon" type="image/png" href="/icons/192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="armandotfit" />

    <title>armandotfit</title>

    <!--
      THE INTERVAL faces — self-hosted, OFL (docs/architecture/
      interval-thesis.md §3.1). Space Grotesk (one variable file,
      wght 300–700) speaks the app's words — the statement,
      subheads, row names, verb labels. Martian Mono (one variable
      file, wght 100–800) keeps EVERY figure at every scale; mono is
      tabular by construction and reads like a machine readout. No
      condensed second family, no width tricks — one file, one
      family, one job each. Mirror trio discipline: this id'd style
      block, the runtime restore in app/_layout.tsx, and the
      injector carry them together — plus the preload lines so the
      first statement and the first figure render in their faces,
      not fallbacks.
    -->
    <link rel="preload" href="/fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/martian-mono-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif.ttf" as="font" type="font/ttf" crossorigin />
    <style id="arq-font-faces">
      /* THE STATEMENT'S VOICE (the editorial pass): Instrument Serif —
         the statement, the day titles, and the verb labels speak it;
         one weight (400), display sizes, the editorial minimal read. */
      @font-face {
        font-family: 'Instrument Serif';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/instrument-serif.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('/fonts/space-grotesk-var.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Martian Mono';
        font-style: normal;
        font-weight: 100 800;
        font-stretch: 75% 112.5%;
        font-display: swap;
        src: url('/fonts/martian-mono-var.woff2') format('woff2');
      }
      /* THE COUNTER'S CUT — the same variable file re-registered at
         the pinned condensed instance; the counter rank alone rides
         it (interval-thesis §3.2, the sight amendment). One
         download: the regular face above already fetches the file. */
      @font-face {
        font-family: 'Martian Mono Condensed';
        font-style: normal;
        font-weight: 100 800;
        font-stretch: 75%;
        font-display: swap;
        src: url('/fonts/martian-mono-var.woff2') format('woff2');
      }
    </style>

    <!--
      THE INTERVAL boot plate — the pre-JS cover. armandotfit's
      design language opens as the printed card: the card's edge tone
      (#E9E2D2 — the editorial pass's card edge) with the name stamped in ink
      2px red-ink rule beneath it — not a white flash, not a colored
      plate. The root layout lifts it via markBootReady() →
      html[data-boot-ready] as soon as React mounts (see
      utils/routeTransition.ts); reduced-motion users keep it as a
      static cover that simply disappears on lift. Pure CSS + one
      attribute — no script needed.
    -->
    <style id="ink-boot-plate">
      html:not([data-boot-ready]) body {
        background: #e9e2d2;
      }
      html:not([data-boot-ready]) #root::before {
        content: 'ARMANDOTFIT';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e9e2d2;
        color: #251f18;
        font-family: 'Martian Mono', -apple-system, sans-serif;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        z-index: 9999;
      }
      html:not([data-boot-ready]) #root::after {
        content: '';
        position: fixed;
        left: 50%;
        top: calc(50% + 22px);
        width: 84px;
        height: 2px;
        margin-left: -42px;
        background: #be2b20;
        z-index: 9999;
      }
      html[data-boot-ready] #root::before,
      html[data-boot-ready] #root::after {
        content: none;
      }
    </style>

    <!--
      The global shell CSS — keyed by id so the injector and the runtime
      injection share one key. Consumers self-hosting fonts: declare the
      @font-face block in an id'd <style> here and add the matching
      <link rel="preload" as="font" crossorigin> lines — the injector
      carries both into every exported route.
    -->
    <style id="global-scrollbar-css">
      /* NATIVE FEEL — text is not selectable by default (it's a PWA,
         not a document); inputs stay selectable so typing works. */
      * {
        -webkit-user-select: none;
        user-select: none;
      }
      /* The root canvas eases between the palette and the curtain's
         ink — the status bar transition matches the sweep. */
      html,
      body {
        transition: background-color 200ms ease;
      }
      input,
      textarea {
        -webkit-user-select: auto;
        user-select: auto;
        /* iOS auto-zooms into any input with font-size < 16px —
           enforce the minimum to prevent the zoom (maximum-scale
           alone is ignored by iOS 10+ for accessibility). */
        font-size: 16px !important;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #e9e2d2;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      /* Hide scrollbars across the entire app. The mobile-native
         indicators are gated per-ScrollView via
         showsVerticalScrollIndicator={false}; on web the only
         systematic way to suppress the always-visible desktop
         scrollbar is global CSS. A visible scrollbar on the
         centered 420pt mobile-first column reads as desktop chrome
         and breaks the immersive feel. */
      *::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>

    <!--
      The focus law (broadsheet-thesis P-FOCUS-1): the UA focus outline
      never leaks — RN-web renders real buttons/inputs whose default
      WebKit ring reads as alien chrome — and every focusable control
      carries OUR ring instead: a 2px rule in the element's own ink
      (currentColor — mode-correct by construction; inputs that draw the
      kit's own focus ring override this on their own boxShadow).
      Mirror trio: this block + the runtime restore in app/_layout.tsx
      (the injector carries id'd styles into every exported route).
    -->
    <style id="global-focus-css">
      button:focus,
      [role='button']:focus,
      [role='link']:focus,
      a:focus,
      select:focus {
        outline-width: 0;
        box-shadow: 0 0 0 2px currentColor;
      }
      input:focus,
      textarea:focus {
        outline-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
